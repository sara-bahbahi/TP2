<!DOCTYPE html>
<html lang="fr">
    <head>
        <title> Drag and Drop </title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="exo14.css">
    </head>

    <body>
        <h2>Drag and Drop Example</h2>
        
        <div id="total">
        <div id="div1">
            <p >A déplacer</p>
            <div class="elements" draggable="true">Elément 1</div>
            <div class="elements" draggable="true">Elément 2</div>
            <div class="elements" draggable="true">Elément 3</div>  
        </div>

        <div id="div2">
            <p>Déposez ici</p>
        </div>
        </div>



        <script>
            let elements=document.getElementsByClassName("elements");
            let move;
            
            for(let i=0;i<elements.length;i++){
                elements[i].addEventListener("dragstart",function(event){
                    move=event.target;
                })
            }

            let zone=document.getElementById("div2") ;

            zone.addEventListener("dragover",function(event){
                event.preventDefault();
            })

            zone.addEventListener("drop",function(event){
                event.preventDefault();
                zone.appendChild(move);
            })

           
        </script>
    </body>
</html>
