<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Menu déroulant animé</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="exo6.css">
        
    </head>
    <body>
       <div>
        <input type="button" value="Menu" id="menu" onclick="afficher()">
        <div class="cacher"><button class="button">Profil</button></div>
        <div class="cacher"><button class="button">Paramètres</button></div>
        <div class="cacher"><button class="button">Commandes</button></div>
        <div class="cacher"><button class="button">Déconnexion</button></div>
       </div>
     
        <script language="javascript">
        let elements =document.getElementsByClassName("cacher");
        let temp=true;
        function afficher(){
           
            if(temp){
                for(var i=0;i<elements.length;i++){
                elements[i].style.maxHeight = "40px";
                elements[i].style.opacity = "1";
            }
            temp=false;
            }else{
                for(var i=0;i<elements.length;i++){
                 elements[i].style.maxHeight = "0";
                 elements[i].style.opacity = "0";
            }
            temp=true;
            }
            
            
        }
            
        </script>
    </body>
</html>
