<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Formulaire de validation</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="exo3.css">
    </head>
    <body>
        <form id="myform">
            <label>Nom: <input type="text" placeholder="Entrez votre nom" class="champ" name="data"></label></br>
            <label>Email: <input type="text" placeholder="Entrez votre email"  class="champ" name="data"></label></br>
            <input type="submit" value="soumettre" id="button">
        </form>
       
        <script language="javascript">
            let inputs=document.getElementsByName("data");
            let form=document.getElementById("myform");
            
            form.addEventListener("submit",function(){
                event.preventDefault();

                if(inputs[0].value===""){
                   alert("Veuillez entrez votre nom pour terminer l'opération !!");
                }
                if(inputs[1].value===""){
                   alert("Veuillez entrez votre email pour terminer l'opération !!");
                }
            });

        </script>
    </body>


</html>
