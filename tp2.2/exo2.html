<!DOCTYPE html>
<html lang="Fr">
    <head>
        <title>Afficher/Masquer le texte</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="exo2.css">
        
    </head>
    <body>
        <p id="p1" style="display: none;" >Bonjour je suis Sara BAHBAHI</p>

        <input type="button" value="Afficher" class="buttons" onclick="afficher()">
        <input type="button" value="Masquer" class="buttons" onclick="masquer()">


        <script language="javascript">

            let elements=document.getElementsByTagName("p");
           function afficher(){
              for(var i=0 ; i<elements.length ; i++){
                elements[i].style.display="block";
              }
           }

           function masquer(){
              for(var i=0 ; i<elements.length ; i++){
                elements[i].style.display="none";
              }
           }

        </script>
    </body>


</html>
